<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <title>Overall Architecture of the Proposed Mamba-TransQR Framework</title>
  <desc>Implemented Phase 3 Mamba-TransQR architecture using the experimental lightweight state-space backend.</desc>
  <style>
    .title { font: 600 38px Arial, Helvetica, sans-serif; fill: #0F172A; }
    .heading { font: 600 30px Arial, Helvetica, sans-serif; fill: #0F172A; }
    .label { font: 600 27px Arial, Helvetica, sans-serif; fill: #0F172A; }
    .body { font: 400 24px Arial, Helvetica, sans-serif; fill: #334155; }
    .small { font: 400 21px Arial, Helvetica, sans-serif; fill: #475569; }
    .backend-note { font: italic 9pt Arial, Helvetica, sans-serif; fill: #94A3B8; }
    .chip { font: 600 21px Arial, Helvetica, sans-serif; fill: #1E293B; }
    .box { stroke: #334155; stroke-width: 3; rx: 16; ry: 16; }
    .line { fill: none; stroke: #334155; stroke-width: 4; }
    .blue-line { fill: none; stroke: #2563EB; stroke-width: 4; }
    .skip { fill: none; stroke: #A8B0BC; stroke-width: 2.2; stroke-dasharray: 9 8; }
    .arrowhead { fill: #334155; }
    .bluehead { fill: #2563EB; }
    .skiphead { fill: #A8B0BC; }
  </style>
  <rect width="1200" height="1800" fill="#FFFFFF"/>

  <text x="600" y="52" text-anchor="middle" class="title">Overall Architecture of the Proposed Mamba-TransQR Framework</text>

  <!-- Configuration strip -->
  <rect x="45" y="85" width="1110" height="92" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2" rx="18" ry="18"/>
  <text x="145" y="124" text-anchor="middle" class="chip">Input</text><text x="145" y="153" text-anchor="middle" class="small">128 × 128</text>
  <line x1="245" y1="103" x2="245" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <text x="342" y="124" text-anchor="middle" class="chip">Patch size</text><text x="342" y="153" text-anchor="middle" class="small">8</text>
  <line x1="440" y1="103" x2="440" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <text x="555" y="124" text-anchor="middle" class="chip">Embedding</text><text x="555" y="153" text-anchor="middle" class="small">96</text>
  <line x1="670" y1="103" x2="670" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <text x="770" y="124" text-anchor="middle" class="chip">Heads</text><text x="770" y="153" text-anchor="middle" class="small">6</text>
  <line x1="870" y1="103" x2="870" y2="160" stroke="#CBD5E1" stroke-width="2"/>
  <text x="1005" y="124" text-anchor="middle" class="chip">Parameters</text><text x="1005" y="153" text-anchor="middle" class="small">1,476,259</text>

  <!-- Encoder input -->
  <rect x="390" y="215" width="420" height="92" fill="#F8FAFC" class="box"/>
  <text x="600" y="253" text-anchor="middle" class="label">Input degraded QR image</text>
  <text x="600" y="284" text-anchor="middle" class="small">RGB tensor: 128 × 128 × 3</text>

  <path d="M600 307 V340" class="line"/><polygon points="600,354 590,336 610,336" class="arrowhead"/>
  <rect x="390" y="354" width="420" height="105" fill="#E0F2FE" class="box"/>
  <text x="600" y="394" text-anchor="middle" class="label">Patch Embedding</text>
  <text x="600" y="427" text-anchor="middle" class="body">Conv2d: kernel 8, stride 8</text>
  <text x="600" y="452" text-anchor="middle" class="small">16 × 16 grid = 256 tokens × 96</text>

  <path d="M600 459 V492" class="line"/><polygon points="600,506 590,488 610,488" class="arrowhead"/>
  <rect x="390" y="506" width="420" height="88" fill="#EDE9FE" class="box"/>
  <text x="600" y="544" text-anchor="middle" class="label">Learnable Positional Embedding</text>
  <text x="600" y="574" text-anchor="middle" class="small">Token shape preserved: 256 × 96</text>

  <path d="M600 594 V625" class="line"/><polygon points="600,639 590,621 610,621" class="arrowhead"/>

  <!-- Six sequential hybrid blocks -->
  <rect x="90" y="639" width="1020" height="585" fill="#F8FAFC" stroke="#2563EB" stroke-width="4" rx="24" ry="24"/>
  <text x="600" y="684" text-anchor="middle" class="heading">Hybrid Processing Stages × 6</text>
  <text x="600" y="715" text-anchor="middle" class="small">Six sequential HybridFusionBlock modules; input/output: 256 × 96 tokens</text>

  <circle cx="600" cy="757" r="8" fill="#2563EB"/>
  <path d="M600 757 H325 V795" class="blue-line"/><polygon points="325,809 315,791 335,791" class="bluehead"/>
  <path d="M600 757 H875 V795" class="blue-line"/><polygon points="875,809 865,791 885,791" class="bluehead"/>

  <rect x="155" y="809" width="340" height="150" fill="#DBEAFE" class="box"/>
  <text x="325" y="850" text-anchor="middle" class="label">Transformer branch</text>
  <text x="325" y="886" text-anchor="middle" class="body">Pre-norm MHSA + MLP</text>
  <text x="325" y="919" text-anchor="middle" class="small">6 attention heads</text>
  <text x="325" y="946" text-anchor="middle" class="small">Internal residual connections</text>

  <rect x="705" y="809" width="340" height="150" fill="#DCFCE7" class="box"/>
  <text x="875" y="846" text-anchor="middle" class="label">Lightweight state-space</text>
  <text x="875" y="880" text-anchor="middle" class="label">branch</text>
  <text x="875" y="926" text-anchor="middle" class="backend-note">Experimental backend (not official Mamba-SSM)</text>

  <path d="M325 959 V980 H500 V996" class="blue-line"/><polygon points="500,1010 490,992 510,992" class="bluehead"/>
  <path d="M875 959 V980 H700 V996" class="blue-line"/><polygon points="700,1010 690,992 710,992" class="bluehead"/>

  <rect x="440" y="1010" width="320" height="150" fill="#FEF3C7" class="box"/>
  <text x="600" y="1049" text-anchor="middle" class="label">Feature Fusion</text>
  <text x="600" y="1083" text-anchor="middle" class="body">Concat + LayerNorm</text>
  <text x="600" y="1115" text-anchor="middle" class="body">Sigmoid-gated fusion</text>
  <text x="600" y="1145" text-anchor="middle" class="small">Linear projection</text>

  <path d="M600 1160 V1162" class="line"/><polygon points="600,1176 590,1158 610,1158" class="arrowhead"/>
  <circle cx="600" cy="1199" r="23" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
  <text x="600" y="1209" text-anchor="middle" class="heading">+</text>
  <path d="M600 757 H1080 V1199 H623" class="skip"/><polygon points="609,1199 627,1189 627,1209" class="skiphead"/>
  <text x="985" y="1154" text-anchor="middle" class="small">Stage residual connection</text>

  <!-- Decoder -->
  <path d="M600 1222 V1250" class="line"/><polygon points="600,1264 590,1246 610,1246" class="arrowhead"/>
  <rect x="390" y="1264" width="420" height="102" fill="#E0F2FE" class="box"/>
  <text x="600" y="1303" text-anchor="middle" class="label">Token-to-image reconstruction</text>
  <text x="600" y="1337" text-anchor="middle" class="body">LayerNorm + Linear + patch rearrangement</text>

  <path d="M600 1366 V1398" class="line"/><polygon points="600,1412 590,1394 610,1394" class="arrowhead"/>
  <rect x="390" y="1412" width="420" height="115" fill="#FFEDD5" class="box"/>
  <text x="600" y="1453" text-anchor="middle" class="label">Convolutional refinement decoder</text>
  <text x="600" y="1488" text-anchor="middle" class="body">3×3 Conv + GELU: 3 → 32 → 32 → 3</text>

  <path d="M600 1527 V1558" class="line"/><polygon points="600,1572 590,1554 610,1554" class="arrowhead"/>
  <rect x="350" y="1572" width="500" height="105" fill="#FCE7F3" class="box"/>
  <text x="600" y="1611" text-anchor="middle" class="label">Bounded residual-to-input reconstruction</text>
  <text x="600" y="1647" text-anchor="middle" class="body">input + tanh(refined residual), then clamp to [0, 1]</text>

  <!-- Input-image skip connection -->
  <path d="M810 261 H1135 V1625 H850" class="skip"/><polygon points="836,1625 854,1615 854,1635" class="skiphead"/>
  <rect x="994" y="947" width="182" height="64" fill="#FFFFFF"/>
  <text x="1085" y="974" text-anchor="middle" class="small">Input-image</text>
  <text x="1085" y="1001" text-anchor="middle" class="small">skip connection</text>

  <path d="M600 1677 V1705" class="line"/><polygon points="600,1719 590,1701 610,1701" class="arrowhead"/>
  <rect x="420" y="1719" width="360" height="62" fill="#DCFCE7" class="box"/>
  <g aria-label="QR-code icon" fill="#0F172A">
    <rect x="448" y="1731" width="38" height="38" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="452" y="1735" width="10" height="10"/><rect x="472" y="1735" width="10" height="10"/>
    <rect x="452" y="1755" width="10" height="10"/><rect x="466" y="1749" width="5" height="5"/>
    <rect x="475" y="1756" width="7" height="9"/><rect x="464" y="1759" width="5" height="6"/>
  </g>
  <text x="630" y="1759" text-anchor="middle" class="label">Restored QR image</text>
</svg>
