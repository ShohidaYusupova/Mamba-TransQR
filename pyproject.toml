[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mambatransqr"
version = "0.1.0"
description = "A production-ready research toolkit for Mamba-TransQR models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mamba-TransQR Contributors" }]
keywords = ["deep-learning", "mamba", "transformers", "image-quality", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.26", "Pillow>=10.0", "torch>=2.4", "torchvision>=0.19"]

[project.optional-dependencies]
dev = ["black>=24.10", "mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]
tensorboard = ["tensorboard>=2.14"]

[project.urls]
Homepage = "https://github.com/your-org/Mamba-TransQR"
Repository = "https://github.com/your-org/Mamba-TransQR"
Issues = "https://github.com/your-org/Mamba-TransQR/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mambatransqr"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["mambatransqr"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["mambatransqr"]

[tool.coverage.report]
show_missing = true
fail_under = 80
