# First full paired QR restoration experiment (10,000 image pairs).
dataset:
  root: datasets/first_real_qr_10k
data_loader:
  batch_size: 16
  num_workers: 0
model:
  image_size: 128
  patch_size: 16
  embed_dim: 64
  depth: 4
  num_heads: 4
  dropout: 0.0
  drop_path_rate: 0.0
  mamba_backend: lightweight
trainer:
  epochs: 30
  device: cpu
  seed: 42
  mixed_precision: false
  use_ema: true
  checkpoint_dir: checkpoints/first_real_qr_restoration
  monitor: val_psnr
  monitor_mode: max
optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
loss:
  reconstruction_weight: 1.0
  ssim_weight: 0.2
  edge_weight: 0.2
  structure_weight: 1.0
  decode_consistency_weight: 0.2
output_dir: results/first_real_qr_restoration
