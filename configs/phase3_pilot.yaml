# Phase 3 pilot: Phase 2 training policy with planned architecture improvements.
dataset:
  root: datasets/first_real_qr_10k
data_loader:
  batch_size: 16
  num_workers: 0
model:
  image_size: 128
  patch_size: 8
  embed_dim: 96
  depth: 6
  num_heads: 6
  dropout: 0.0
  drop_path_rate: 0.0
  mamba_backend: lightweight
  decoder_refinement_channels: 32
  residual_learning: true
  residual_scale: 1.0
trainer:
  epochs: 30
  device: cpu
  seed: 42
  mixed_precision: false
  use_ema: true
  ema_decay: 0.995
  checkpoint_dir: checkpoints/phase3_pilot
  monitor: val_psnr
  monitor_mode: max
optimizer:
  name: adamw
  learning_rate: 0.0002
  weight_decay: 0.0001
scheduler:
  name: warmup_cosine
  epochs: 30
  warmup_epochs: 2
  min_lr: 0.000001
early_stopping:
  monitor: val_psnr
  mode: max
  patience: 8
  min_delta: 0.0
loss:
  reconstruction_weight: 1.0
  ssim_weight: 0.1
  edge_weight: 0.05
  structure_weight: 0.1
  decode_consistency_weight: 0.05
output_dir: results/phase3_pilot
