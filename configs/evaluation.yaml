# Mamba-TransQR evaluation and benchmark configuration.
model:
  mamba_backend: mamba_ssm
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2

evaluation:
  device: auto
  metrics: [psnr, ssim, mse, mae]
  data_range: 1.0

qr_decoding:
  backends: [zbar, zxing]

benchmark:
  warmup: 10
  iterations: 100

reports:
  evaluation_json: reports/evaluation.json
  benchmark_csv: reports/benchmark.csv
  summary_markdown: reports/summary.md
