# Mamba-TransQR training configuration.
model:
  mamba_backend: mamba_ssm
  mamba_d_state: 16
  mamba_d_conv: 4
  mamba_expand: 2

trainer:
  epochs: 100
  device: auto
  seed: 42
  gradient_accumulation: 1
  gradient_clip_norm: 1.0
  mixed_precision: true
  use_ema: true
  ema_decay: 0.999
  multi_gpu: false
  checkpoint_dir: checkpoints
  monitor: val_loss
  monitor_mode: min

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  momentum: 0.9

scheduler:
  name: cosine
  epochs: 100
  step_size: 30
  gamma: 0.1
  patience: 10

early_stopping:
  monitor: val_loss
  patience: 10
  mode: min
  min_delta: 0.0
