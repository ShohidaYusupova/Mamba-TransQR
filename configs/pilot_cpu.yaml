# Existing DatasetGenerationConfig schema for the CPU pilot dataset stage.
samples: 600
seed: 42
# Version 20 is the largest selected grid that fits 128px with a four-module border.
versions: [1, 5, 10, 20]
error_correction_levels: [L, M, Q, H]
payload_types: [alphanumeric, numeric, byte, url]
payload_length: 12
image_size: 128
border: 4
foreground: "#000000"
background: "#ffffff"
severities: [mild, moderate, severe]
decoder_backend: null
split_ratios: [0.7, 0.15, 0.15]
